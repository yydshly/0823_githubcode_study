name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "projects/kindergrimm/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout pinned Kindergrimm upstream
        uses: actions/checkout@v4
        with:
          repository: albertobeiz/kindergrimm
          ref: 5857b1e1cae2713d6714ad7dd7f89626bb242f0f
          path: _kindergrimm_upstream
      - name: Assemble Pages site
        run: |
          mkdir -p _site/projects/kindergrimm
          cp -a docs/. _site/
          rsync -a --exclude upstream --exclude evidence projects/kindergrimm/ _site/projects/kindergrimm/
          mkdir -p _site/projects/kindergrimm/evidence
          cp projects/kindergrimm/evidence/{v06-factory-desktop.png,v06-scene-desktop.png,m3-core-factory-desktop.png,m3-core-scene-desktop.png,m4-production-studio-desktop.png,m4-production-studio-mobile.png,m5-runtime-sdk-desktop.png,m5-runtime-sdk-webgl-off.png} _site/projects/kindergrimm/evidence/
          rsync -a --exclude .git _kindergrimm_upstream/ _site/projects/kindergrimm/upstream/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4



